# ─────────────────────────────────────────────────────────────────
# CI/CD — Certmind Odoo 19 → Azure Container Apps
#
# Déclenché à chaque push sur main :
#   1. Validation  : syntaxe Python, XML, manifests        (~1 min)
#   2. Build       : image Docker publiée sur ACR          (~30 min au 1er run)
#   3. Déploiement : mise à jour du Container App          (~2 min)
#
# AUTHENTIFICATION AZURE
# Le tenant ESPRIT interdit aux comptes étudiants de créer un service
# principal ("Insufficient privileges to complete the operation").
# On utilise donc une IDENTITÉ MANAGÉE avec fédération OIDC : GitHub
# prouve son identité par un jeton signé, sans mot de passe stocké.
# Les valeurs ci-dessous ne sont pas des secrets — elles n'autorisent
# rien sans le jeton émis par GitHub pour ce dépôt et cette branche.
# ─────────────────────────────────────────────────────────────────

name: Deploy to Azure

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Requis par la fédération OIDC : GitHub doit pouvoir émettre un jeton.
permissions:
  id-token: write
  contents: read

env:
  ACR_SERVER: certmindacr.azurecr.io
  IMAGE_NAME: certmind-odoo
  RESOURCE_GROUP: rg-certmind
  CONTAINER_APP: certmind-odoo
  AZURE_CLIENT_ID: c52bc377-5154-43f4-976e-2c8accaba87a
  AZURE_TENANT_ID: 604f1a96-cbe8-43f8-abbf-f8eaf5d85730
  AZURE_SUBSCRIPTION_ID: 6073ec94-85a9-4fd3-8217-ed5f5d574928

jobs:

  # ── 1. Validation ───────────────────────────────────────────────
  # Rapide, et bloque la suite en cas d'erreur : inutile d'attendre
  # 30 minutes de build pour découvrir un XML mal formé.
  validate:
    name: Valider les modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntaxe Python
        run: |
          set -e
          find custom_addons -name '*.py' -not -path '*/__pycache__/*' -print0 \
            | xargs -0 -n1 python -m py_compile

      - name: Syntaxe XML
        run: |
          erreurs=0
          for f in $(find custom_addons -name '*.xml'); do
            python -c "import xml.etree.ElementTree as ET; ET.parse('$f')" \
              || { echo "::error file=$f::XML invalide"; erreurs=1; }
          done
          exit $erreurs

      - name: Manifests et fichiers déclarés
        run: |
          python - <<'PY'
          import ast, os, sys
          base, erreurs = 'custom_addons', 0
          for mod in sorted(os.listdir(base)):
              mpath = os.path.join(base, mod, '__manifest__.py')
              if not os.path.exists(mpath):
                  continue
              try:
                  data = ast.literal_eval(open(mpath, encoding='utf-8').read())
              except Exception as exc:
                  print(f"::error file={mpath}::manifest illisible : {exc}")
                  erreurs = 1
                  continue
              for rel in data.get('data', []):
                  if not os.path.exists(os.path.join(base, mod, rel)):
                      print(f"::error::{mod} déclare {rel} qui n'existe pas")
                      erreurs = 1
              print(f"  ok  {mod}")
          sys.exit(erreurs)
          PY

  # ── 2. Build et publication ────────────────────────────────────
  build:
    name: Construire et publier l'image
    needs: validate
    # Sur une pull request, on valide sans publier.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build et push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Le tag SHA permet de revenir à une version précise ;
          # 'latest' sert de référence courante.
          tags: |
            ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Cache des couches : torch, mediapipe et opencv ne sont
          # retéléchargés que si requirements.txt ou le Dockerfile changent.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Déploiement ─────────────────────────────────────────────
  deploy:
    name: Déployer sur Container Apps
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Connexion Azure (OIDC, sans secret)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Mettre à jour le Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Récapitulatif
        run: |
          url=$(az containerapp show \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          {
            echo "### Déploiement terminé"
            echo ""
            echo "Application : https://$url"
            echo ""
            echo "> Si ce commit modifie un modèle Odoo (nouveau champ, nouvelle"
            echo "> vue), l'image seule ne suffit pas : il faut mettre à jour la"
            echo "> base. Exécutez ensuite, depuis votre poste :"
            echo ""
            echo '```bash'
            echo "az containerapp exec --name certmind-odoo --resource-group rg-certmind --command /bin/bash"
            echo "# puis dans le container :"
            echo "odoo --config=/etc/odoo/odoo.conf -d odoo -u nom_du_module --stop-after-init --no-http"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
