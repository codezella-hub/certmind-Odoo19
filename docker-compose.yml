# ─────────────────────────────────────────────────────────────────
# docker-compose.yml — DÉVELOPPEMENT LOCAL
#
# Odoo est rattaché à DEUX réseaux :
#   - certmind_net : son propre réseau, avec PostgreSQL
#   - livekit_net  : le réseau externe où tournent LiveKit, Redis et Minio
#
# Sans ce second réseau, Odoo ne peut pas joindre LiveKit et le
# proctoring affiche « LiveKit disconnected ».
#
# Usage :
#   docker compose up -d --build
#   docker compose logs -f odoo
#   docker compose down
# ─────────────────────────────────────────────────────────────────

services:

  db:
    image: postgres:16
    container_name: certmind_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - certmind_db_data:/var/lib/postgresql/data
    networks:
      - certmind_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    image: certmind-odoo:local
    container_name: certmind_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ODOO_PORT}:8069"
    environment:
      DB_HOST:     ${DB_HOST}
      DB_PORT:     ${DB_PORT}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSLMODE:  ${DB_SSLMODE}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD}
      ODOO_WORKERS:      ${ODOO_WORKERS}
      ODOO_LOG_LEVEL:    ${ODOO_LOG_LEVEL}
      # Limite les threads d'OpenBLAS (numpy, torch, mediapipe).
      # Sans cela, pthread_create échoue et Odoo meurt silencieusement
      # au chargement des librairies IA.
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
    volumes:
      - ./custom_addons:/mnt/extra-addons
      - certmind_web_data:/var/lib/odoo
    networks:
      - certmind_net
      - livekit_net

volumes:
  certmind_db_data:
  certmind_web_data:

networks:
  certmind_net:
    driver: bridge

  # Réseau EXTERNE : celui créé par le docker-compose de LiveKit,
  # où tournent livekit, livekit-egress, redis et minio.
  # Sans ce rattachement, Odoo ne peut pas résoudre le nom « livekit »
  # et le proctoring affiche « LiveKit disconnected ».
  livekit_net:
    external: true
    name: digii_exam_manager_exam_net
